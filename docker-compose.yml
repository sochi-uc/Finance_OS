services:
  finance:
    build: .
    container_name: finance-os
    restart: always
    ports: ["8787:8787"]
    env_file: .env
    environment: { DATA_DIR: /data }
    volumes:
      - ./data:/data          # SQLite lives here (back this up)
      - ./docs:/app/docs
      - ./web:/app/web
      - ./server:/app/server
